name: build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "23.2.8568313"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      # 工具产物已全部提交进 assets（term/src/main/assets/tools/usr/bin/），CI 不再编译，只组装 APK

      # dropbear/dropbearkey 例外：assets 里是 NDK static-pie 版，Android 7 段错误（RC=139），
      # 需用 musl 重编为非 PIE 静态（与 jq/nc 一致）。产物替换回 assets 再打包。
      - name: 重编 dropbear (musl 非PIE静态)
        run: |
          set -eux
          bash scripts/build-dropbear-musl.sh

      - name: 签名配置
        run: |
          set -eux
          mkdir -p dist
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASS }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
            STORE_PASS="${{ secrets.KEYSTORE_PASS }}"
            echo "使用持久化签名密钥"
          else
            STORE_PASS="termtools-ci-2026"
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias termtools \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=TermTools, OU=Tools, O=TermTools, L=Unknown, ST=Unknown, C=CN"
            echo "使用 CI 临时签名密钥（上传产物以保存，可固化到 secrets）"
          fi
          {
            echo "store.file=/tmp/release.keystore"
            echo "store.password=$STORE_PASS"
            echo "key.alias=termtools"
            echo "key.password=$STORE_PASS"
          } > /tmp/signing.properties
          cp /tmp/release.keystore dist/release.keystore
          cp /tmp/signing.properties dist/signing.properties

      - name: 编译 elf-cleaner
        run: |
          set -eux
          git clone --depth 1 https://github.com/termux/termux-elf-cleaner /tmp/elf-cleaner
          cmake -S /tmp/elf-cleaner -B /tmp/elf-cleaner/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/elf-cleaner/build -j2
          sudo install /tmp/elf-cleaner/build/termux-elf-cleaner /usr/local/bin/elf-cleaner

      - name: 构建 APK
        run: |
          set -eux
          ./gradlew :term:assembleFullRelease -Psigning.properties=/tmp/signing.properties

      - name: 组装发布目录
        run: |
          set -eux
          cp term/build/outputs/apk/full/release/*.apk dist/
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: termtools-box-release
          path: dist/
