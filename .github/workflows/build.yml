name: build

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DROPBEAR_VERSION: "2026.94"
      BUSYBOX_VERSION: "1.36.1"
      NDK_VERSION: "23.2.8568313"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK / NDK
        uses: android-actions/setup-android@v3

      - name: 安装 SDK 组件
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platforms;android-36" \
            "build-tools;37.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;3.22.1"

      - name: 编译 dropbear
        run: |
          set -eux
          TC="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TC/armv7a-linux-androideabi19-clang"
          [ -x "$CC" ] || CC="$TC/armv7a-linux-androideabi21-clang"
          echo "使用编译器: $CC"
          curl -fsSL -o /tmp/dropbear.tar.bz2 "https://dropbear.nl/mirror/releases/dropbear-${DROPBEAR_VERSION}.tar.bz2"
          tar xjf /tmp/dropbear.tar.bz2 -C /tmp
          python3 "patches/dropbear-android-user.py" "/tmp/dropbear-${DROPBEAR_VERSION}/src"
          cd "/tmp/dropbear-${DROPBEAR_VERSION}"
          export CC="$CC"
          export AR="$TC/llvm-ar" RANLIB="$TC/llvm-ranlib" STRIP="$TC/llvm-strip"
          ./configure --host=arm-linux-androideabi \
            --disable-zlib --disable-pam --disable-shadow \
            CC="$CC" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
            CFLAGS="-O2 -static" LDFLAGS="-static" \
            CPPFLAGS="-DDROPBEAR_SVR_PASSWORD_AUTH=0"
          make -j2 dropbear dropbearkey
          file dropbear dropbearkey dbclient

      - name: 编译 busybox
        run: |
          set -eux
          TC="$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # busybox 用 API21：missing_syscalls.c 在 __ANDROID_API__<21 会重定义 bionic 已含的 tcdrain
          CC="$TC/armv7a-linux-androideabi21-clang"
          [ -x "$CC" ] || CC="$TC/armv7a-linux-androideabi19-clang"
          echo "使用编译器: $CC"
          curl -fsSL -o /tmp/busybox.tar.bz2 "https://busybox.net/downloads/busybox-${BUSYBOX_VERSION}.tar.bz2"
          tar xjf /tmp/busybox.tar.bz2 -C /tmp
          cd "/tmp/busybox-${BUSYBOX_VERSION}"
          export CC="$CC"
          make defconfig
          if [ -f configs/android_ndk_defconfig ]; then
            echo "使用 android_ndk_defconfig（已禁用 NDK 不兼容 applet）"
            make android_ndk_defconfig
          else
            echo "无 android_ndk_defconfig，defconfig 并关闭 tc（NDK 头文件缺 TCA_CBQ_*）"
            sed -i 's/^CONFIG_TC=y$/# CONFIG_TC is not set/' .config
          fi
          sed -i 's/# CONFIG_STATIC is not set/CONFIG_STATIC=y/' .config
          sed -i 's/# CONFIG_ANDROID is not set/CONFIG_ANDROID=y/' .config
          # android_ndk_defconfig 内置 EXTRA_CFLAGS 含 gcc 专属参数(-mthumb-interwork/-frename-registers/-fuse-ld=bfd)，clang 不认；
          # 替换为空字符串保留符号，否则 silentoldconfig 对 string 类型 NEW 符号在 stdin EOF 时 abort
          sed -i 's/^CONFIG_EXTRA_CFLAGS=.*/CONFIG_EXTRA_CFLAGS="-DANDROID -D__ANDROID__"/' .config
          # android_ndk_defconfig 内置 SYSROOT=/opt/android-ndk/... 失效，Makefile.flags 会拼 --sysroot= 导致找不到 bionic 头
          sed -i "s|^CONFIG_SYSROOT=.*|CONFIG_SYSROOT=\"$ANDROID_HOME/ndk/${NDK_VERSION}/toolchains/llvm/prebuilt/linux-x86_64/sysroot\"|" .config
          # EXTRA_LDFLAGS 也引用失效 /opt/android-ndk 路径，静态链接不需要，置空
          sed -i 's/^CONFIG_EXTRA_LDFLAGS=.*/CONFIG_EXTRA_LDFLAGS=""/' .config
          # FEATURE_COMPRESS_USAGE 需 host 编译 usage_compressed(依赖宿主 zlib)，交叉编译易失败，关闭
          sed -i 's/^CONFIG_FEATURE_COMPRESS_USAGE=y$/# CONFIG_FEATURE_COMPRESS_USAGE is not set/' .config
          # 兜底开启 HTTPD/FTPD（盒子文件传输用；android_ndk_defconfig 可能因版本差异关闭）
          sed -i 's/^# CONFIG_HTTPD is not set$/CONFIG_HTTPD=y/' .config
          sed -i 's/^# CONFIG_FTPD is not set$/CONFIG_FTPD=y/' .config
          # busybox Makefile 用 "CC=$(CROSS_COMPILE)gcc" 覆盖环境变量，须命令行传 CC/CROSS_COMPILE= 
          make -j2 busybox CROSS_COMPILE= \
            CC="$CC" \
            AR="$TC/llvm-ar" NM="$TC/llvm-nm" RANLIB="$TC/llvm-ranlib" \
            STRIP="$TC/llvm-strip" OBJCOPY="$TC/llvm-objcopy" OBJDUMP="$TC/llvm-objdump"
          file busybox

      - name: 编译附加工具 (musl 静态)
        run: |
          set -eux
          bash scripts/build-extra-tools.sh

      - name: 下载 ffmpeg 预编译 (armv7a)
        run: |
          set -eux
          mkdir -p /tmp/ffmpeg
          # Khang-NT/ffmpeg-binary-android 的 armeabi-v7a LITE 版（2018 构建，支持 Android 16+，适合 API19 盒子）
          curl -fSL --connect-timeout 60 --retry 5 --retry-delay 5 \
            -o /tmp/ffmpeg.tar.bz2 \
            "https://github.com/Khang-NT/ffmpeg-binary-android/releases/download/2018-07-31/arm-lite.tar.bz2"
          tar xjf /tmp/ffmpeg.tar.bz2 -C /tmp/ffmpeg
          find /tmp/ffmpeg -name "ffmpeg" -o -name "ffprobe" | head

      - name: 组装工具 assets
        run: |
          set -eux
          mkdir -p "term/src/main/assets/tools/usr/bin"
          cp "/tmp/dropbear-${DROPBEAR_VERSION}/dropbear"    "term/src/main/assets/tools/usr/bin/dropbear"
          cp "/tmp/dropbear-${DROPBEAR_VERSION}/dropbearkey" "term/src/main/assets/tools/usr/bin/dropbearkey"
          cp "/tmp/busybox-${BUSYBOX_VERSION}/busybox"       "term/src/main/assets/tools/usr/bin/busybox"
          cp /tmp/extra-tools/*                              "term/src/main/assets/tools/usr/bin/"
          # ffmpeg 预编译产物（找 ffmpeg/ffprobe 二进制拷入；tar 内可能有目录结构）
          find /tmp/ffmpeg \( -name "ffmpeg" -o -name "ffprobe" \) -type f -exec cp {} "term/src/main/assets/tools/usr/bin/" \;
          ls -la "term/src/main/assets/tools/usr/bin/"

      - name: 签名配置
        run: |
          set -eux
          mkdir -p dist
          if [ -n "${{ secrets.KEYSTORE_B64 }}" ] && [ -n "${{ secrets.KEYSTORE_PASS }}" ]; then
            echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > /tmp/release.keystore
            STORE_PASS="${{ secrets.KEYSTORE_PASS }}"
            echo "使用持久化签名密钥"
          else
            STORE_PASS="termtools-ci-2026"
            keytool -genkeypair -v \
              -keystore /tmp/release.keystore \
              -alias termtools \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
              -dname "CN=TermTools, OU=Tools, O=TermTools, L=Unknown, ST=Unknown, C=CN"
            echo "使用 CI 临时签名密钥（上传产物以保存，可固化到 secrets）"
          fi
          {
            echo "store.file=/tmp/release.keystore"
            echo "store.password=$STORE_PASS"
            echo "key.alias=termtools"
            echo "key.password=$STORE_PASS"
          } > /tmp/signing.properties
          cp /tmp/release.keystore dist/release.keystore
          cp /tmp/signing.properties dist/signing.properties

      - name: 编译 elf-cleaner
        run: |
          set -eux
          git clone --depth 1 https://github.com/termux/termux-elf-cleaner /tmp/elf-cleaner
          cmake -S /tmp/elf-cleaner -B /tmp/elf-cleaner/build -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/elf-cleaner/build -j2
          sudo install /tmp/elf-cleaner/build/termux-elf-cleaner /usr/local/bin/elf-cleaner

      - name: 构建 APK
        run: |
          set -eux
          ./gradlew :term:assembleFullRelease -Psigning.properties=/tmp/signing.properties

      - name: 组装发布目录
        run: |
          set -eux
          cp term/build/outputs/apk/full/release/*.apk dist/
          ls -la dist/

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: termtools-box-release
          path: dist/
